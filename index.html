<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外汇管理局数字外管平台（ASOne）· 教学实训系统</title>
  <style>
/* ============================================================
 * styles.css —— 外汇收汇申报教学实训系统
 * 仿 ASOne 数字外管平台风格 v5（逐像素对齐真实截图）
 * ============================================================ */
:root {
  --c-header: #0077AA;
  --c-header-dark: #005a82;
  --c-tab-active: #0077AA;
  --c-tab-bg: #f5f7fa;
  --c-tab-border: #d5dde6;
  --c-sidebar: #f7f9fc;
  --c-sidebar-border: #c8d4e0;
  --c-tree-line: #a8b8c8;
  --c-tree-hover: #e6f0f8;
  --c-tree-active-bg: #0099CC;       /* 选中项：蓝色底（截图一致） */
  --c-tree-active-text: #fff;        /* 选中项：白字 */
  --c-tree-text: #333;
  --c-tree-muted: #555;
  --c-tree-parent-color: #006699;
  --c-tree-arrow: #666;
  --c-main-bg: #f0f2f5;
  --c-main: #ffffff;
  --c-border: #ddd;
  --c-table-border: #dde4ec;
  --c-text: #222;
  --c-muted: #777;
  --c-primary: #0077AA;
  --c-primary-soft: #eaf4fa;
  --c-accent: #0f8a6d;
  --c-warn: #c9760a;
  --c-warn-soft: #fdf2e0;
  --c-danger: #c0392b;
  --c-danger-soft: #fbe9e7;
  --c-ok: #1f9d57;
  --c-ok-soft: #e6f6ec;
  --c-pending: #b8860b;
  --c-pending-soft: #fbf3df;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  background: var(--c-main-bg);
  color: var(--c-text);
  font-size: 14px;
  line-height: 1.6;
}

/* ============================================================
 * ASOne 风格顶栏
 * ============================================================ */
.topbar {
  background: var(--c-header);
  color: #fff;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 30;
  flex-shrink: 0;
}
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand .safe-logo {
  background: rgba(255,255,255,.22); border-radius: 50%;
  width: 32px; height: 32px;
  display: grid; place-items: center; font-size: 13px; font-weight: 800;
  flex-shrink: 0; letter-spacing: -0.5px;
}
.topbar .brand .title-group { display: flex; flex-direction: column; gap: 1px; }
.topbar .brand .platform-name {
  font-size: 15px; font-weight: 700; letter-spacing: .5px;
}
.topbar .brand .sub-title {
  font-size: 11px; opacity: .82; letter-spacing: .3px;
}
.topbar .userbox { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.topbar .userbox .user-info { text-align: right; line-height: 1.35; }
.topbar .userbox .ver-badge {
  display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 8px;
  background: rgba(255,255,255,.22); color: #fff; font-size: 11px; font-weight: 600;
}
.topbar .userbox .user-role {
  font-size: 11px; opacity: .75;
}
.topbar .btn-ghost {
  background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.35);
  padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
.topbar .btn-ghost:hover { background: rgba(255,255,255,.32); }

/* 用户图标按钮（蓝色圆形+人形图标） */
.user-icon-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,.25); color: #fff;
  display: grid; place-items: center; font-size: 16px; cursor: pointer;
  border: none; flex-shrink: 0;
}
.user-icon-btn:hover { background: rgba(255,255,255,.4); }

/* 用户菜单（导出/导入/重置/退出） */
.user-menu-wrap { position: relative; flex-shrink: 0; }
.user-menu {
  position: absolute; right: 0; top: 38px; min-width: 160px;
  background: #fff; color: #333; border: 1px solid #e3e8f0; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(20,40,80,.16); padding: 6px; z-index: 60;
}
.um-item { padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.um-item:hover { background: #f0f4fa; }
.um-item.um-danger { color: #d4380d; }
.um-item.um-danger:hover { background: #fff1f0; }

/* 已保存状态指示 */
.user-info .ui-name { font-weight: 600; }
.user-info .ui-save { font-size: 11px; color: #c8e6c9; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.user-info .ui-save .dot { width: 7px; height: 7px; border-radius: 50%; background: #52c41a; box-shadow: 0 0 0 2px rgba(82,196,26,.25); }
.user-info .ui-save.saved .dot { background: #ffd666; }

/* 顶部存储警告条 */
.store-warn {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  background: #fff1f0; color: #a8071a; border-bottom: 1px solid #ffccc7;
  padding: 8px 16px; font-size: 13px; text-align: center;
}

/* 轻量提示条 */
.fx-toast {
  position: fixed; left: 50%; bottom: 38px; transform: translateX(-50%) translateY(20px);
  background: #1f2d3d; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 1000;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.fx-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
 * 标签页导航栏
 * ============================================================ */
.tab-bar {
  background: var(--c-tab-bg);
  border-bottom: 1px solid var(--c-tab-border);
  display: flex;
  align-items: stretch;
  padding-left: 16px;
  position: sticky;
  top: 52px;
  z-index: 25;
  flex-shrink: 0;
}
.tab-item {
  padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
  color: var(--c-tree-text); border: none; background: none;
  border-bottom: 3px solid transparent; transition: all .15s;
  position: relative;
}
.tab-item:hover { background: rgba(0,153,204,.06); }
.tab-item.active {
  color: #fff; background: var(--c-tab-active); border-bottom-color: var(--c-header-dark);
}

/* ============================================================
 * 主布局
 * ============================================================ */
.layout { display: flex; flex: 1; min-height: 0; }

/* ============================================================
 * 左侧树形侧栏 —— 对齐真实 ASOne 截图
 * ============================================================ */
.sidebar {
  width: 230px; background: var(--c-sidebar); border-right: 1px solid var(--c-sidebar-border);
  flex-shrink: 0; overflow-y: auto; overflow-x: hidden;
  padding: 8px 0 16px;
}

/* 搜索框 */
.sidebar-search { margin: 0 10px 10px; position: relative; }
.sidebar-search input {
  width: 100%; border: 1px solid var(--c-tab-border); border-radius: 4px;
  padding: 6px 10px 6px 28px; font-size: 13px; outline: none;
  background: #fff;
}
.sidebar-search input:focus { border-color: var(--c-primary); }
.sidebar-search::before {
  content: '📄';
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 13px; pointer-events: none;
}

/* 树节点容器 */
.tree-node { user-select: none; }

/* 父节点（分组标题） */
.tree-parent {
  display: flex; align-items: center; padding: 8px 10px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--c-tree-parent-color); gap: 5px;
  line-height: 1.4;
}
.tree-parent:hover { background: var(--c-tree-hover); }
.tree-parent .arrow {
  width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--c-tree-arrow); font-size: 11px; flex-shrink: 0;
  line-height: 1;
}

/* 子项容器 */
.tree-children { display: none; position: relative; }
.tree-children.show { display: block; }

/*
 * 子项（叶子节点）—— 带树线连接符
 *
 * 截图中的结构：
 *   涉外收入申报单 ▼
 *   │
 *   ├── ● 申报信息录入      ← 选中时蓝色底白字
 *   ├── ● 申报信息修改
 *   └── ● 审核疑问反馈
 */
.tree-leaf {
  display: flex; align-items: center; padding: 6px 10px 6px 26px; cursor: pointer;
  font-size: 13px; color: var(--c-tree-muted); position: relative;
  line-height: 1.6;
}
/* 竖线 */
.tree-leaf::before {
  content: ''; position: absolute; left: 17px; top: 0; bottom: 0;
  width: 1px; background: var(--c-tree-line);
}
/* 横线分支 */
.tree-leaf::after {
  content: ''; position: absolute; left: 17px; top: 50%; width: 8px; height: 1px;
  background: var(--c-tree-line);
}
/* 小圆点 */
.tree-leaf .leaf-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c-tree-line); flex-shrink: 0; margin-right: 6px;
  position: relative; z-index: 1;
}
.tree-leaf:hover { background: var(--c-tree-hover); color: var(--c-tree-text); }
.tree-leaf:hover .leaf-dot { background: var(--c-primary); }

/* ★ 选中态：蓝色底 + 白字（和截图完全一致） */
.tree-leaf.active {
  background: var(--c-tree-active-bg) !important;
  color: var(--c-tree-active-text) !important;
  font-weight: 600;
}
.tree-leaf.active .leaf-dot { background: #fff !important; }
.tree-leaf.active::before,
.tree-leaf.active::after { background: rgba(255,255,255,.3); }

/* 最后一个子项的竖线只画到中间 */
.tree-children > .tree-leaf:last-child::before { bottom: 50%; }

/* 无子项的叶子节点 */
.tree-leaf-simple {
  display: flex; align-items: center; padding: 7px 10px; cursor: pointer;
  font-size: 13px; color: var(--c-tree-muted);
}
.tree-leaf-simple:hover { background: var(--c-tree-hover); color: var(--c-tree-text); }

/* ============================================================
 * 右侧主内容区
 * ============================================================ */
.main {
  flex: 1; padding: 16px 20px; overflow-x: hidden; overflow-y: auto;
  min-width: 0; background: var(--c-main-bg);
  position: relative;
}

/* ---- 页面标题（蓝色，带星标） ---- */
.page-title {
  font-size: 15px; font-weight: 700; color: var(--c-header);
  margin: 0 0 8px; display: flex; align-items: center; gap: 4px;
}
.page-title .req-star { color: var(--c-danger); font-size: 13px; }

/* ---- 内容区子标签栏（申报信息修改 | 申报信息录入） ---- */
.sub-tab-bar {
  display: flex; gap: 0; margin-bottom: 10px;
}
.sub-tab {
  padding: 6px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--c-table-border); background: #fff; color: var(--c-tree-text);
  border-bottom: none; border-radius: 3px 3px 0 0; margin-right: 2px;
}
.sub-tab:hover { background: var(--c-tree-hover); }
.sub-tab.active {
  background: var(--c-header); color: #fff; border-color: var(--c-header);
}

/* ---- 面包屑导航 ---- */
.breadcrumb {
  font-size: 12px; color: var(--c-muted); margin-bottom: 12px;
  padding: 6px 10px; background: #fff; border: 1px solid var(--c-table-border);
  border-radius: 3px;
}
.breadcrumb .bc-current { color: var(--c-primary); font-weight: 600; }

/* ---- 筛选条件栏 ---- */
.filter-bar {
  background: #fff; border: 1px solid var(--c-table-border);
  border-radius: 3px; padding: 10px 14px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px;
}
.filter-bar label { color: var(--c-muted); font-weight: 600; white-space: nowrap; }
.filter-bar input[type="date"],
.filter-bar input[type="text"] {
  border: 1px solid var(--c-border); border-radius: 3px; padding: 4px 8px;
  font-size: 13px; outline: none;
}
.filter-bar input:focus { border-color: var(--c-primary); }
.filter-bar .sep { color: var(--c-muted); }
.btn-query {
  background: var(--c-header); color: #fff; border: none;
  padding: 5px 14px; border-radius: 3px; cursor: pointer; font-size: 13px;
  font-weight: 600;
}
.btn-query:hover { background: var(--c-header-dark); }

/* 导出按钮（和截图一致） */
.btn-export {
  background: #fff; color: var(--c-tree-text); border: 1px solid var(--c-table-border);
  padding: 5px 14px; border-radius: 3px; cursor: pointer; font-size: 13px;
  font-weight: 600; margin-left: 4px;
}
.btn-export:hover { background: var(--c-tree-hover); border-color: var(--c-primary); color: var(--c-primary); }

/* 查询页进度条（截图中分页上方有灰色进度条） */
.query-progress {
  width: 100%; height: 8px; background: #e8e8e8; border-radius: 4px;
  margin-bottom: 10px; overflow: hidden;
}
.query-progress-bar {
  height: 100%; background: linear-gradient(90deg, #0099CC, #0077AA);
  border-radius: 4px; transition: width .3s ease;
}

/* ---- 数据表格（仿 ASOne 网格线风格） ---- */
.data-table-wrap {
  background: #fff; border: 1px solid var(--c-table-border); border-radius: 3px;
  overflow: hidden; margin-bottom: 12px;
}
table.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
table.data-table th {
  background: #f0f4f8; color: var(--c-tree-text); font-weight: 700;
  border: 1px solid var(--c-table-border); padding: 8px 10px;
  text-align: center; white-space: nowrap;
}
table.data-table td {
  border: 1px solid var(--c-table-border); padding: 7px 10px;
  text-align: center; color: var(--c-text);
}
table.data-table tbody tr:hover { background: #f5f8fc; }
/* 查询结果可点击行（悬停更明显，提示可点击） */
table.data-table tbody tr.query-row-clickable:hover { background: #e8f0fe; cursor: pointer; }
table.data-table tbody tr.query-row-clickable td { transition: background 0.15s; }
/* 序号列居中 */
table.data-table td.col-index { width: 50px; }
/* 操作列 */
table.data-table td.col-actions { white-space: nowrap; }

/* ---- 分页栏 ---- */
.pagination {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 6px; font-size: 13px; padding: 8px 0; color: var(--c-muted);
}
.pagination .page-info { margin-right: auto; font-weight: 600; }
.page-btn {
  border: 1px solid var(--c-table-border); background: #fff; padding: 3px 10px;
  border-radius: 3px; cursor: pointer; font-size: 12px; color: var(--c-tree-text);
}
.page-btn:hover { background: var(--c-tree-hover); border-color: var(--c-primary); color: var(--c-primary); }
.page-btn:disabled { opacity: .4; cursor: default; }

/* ---- "拖拽至此上传"浮动提示 ---- */
.upload-hint {
  position: absolute; right: 24px; top: 16px; z-index: 10;
  display: flex; align-items: center; gap: 6px; color: var(--c-primary);
  font-size: 13px; font-weight: 600; cursor: default; background: #fff;
  padding: 6px 14px; border-radius: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08); border: 1px solid #e0e6ed;
}
.upload-hint .upload-icon {
  width: 24px; height: 24px; border-radius: 50%; background: var(--c-header); color: #fff;
  display: grid; place-items: center; font-size: 12px;
}

/* ============================================================
 * 卡片、表单、按钮、通用表格
 * ============================================================ */
.card {
  background: #fff; border: 1px solid var(--c-border); border-radius: 6px;
  box-shadow: var(--shadow-sm); padding: 16px 18px; margin-bottom: 14px;
}
.card h3 { margin: 0 0 12px; font-size: 15px; color: var(--c-primary); display: flex; align-items: center; gap: 6px; }
.card .hint { color: var(--c-muted); font-size: 13px; margin: -8px 0 12px; }

.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--c-muted); font-weight: 600; }
.field label .req { color: var(--c-danger); margin-left: 2px; }
.field input, .field select, .field textarea {
  border: 1px solid var(--c-border); border-radius: 4px; padding: 8px 10px; font-size: 14px;
  background: #fff; color: var(--c-text); font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 2px var(--c-primary-soft);
}
.field textarea { resize: vertical; min-height: 60px; }
.field .err { color: var(--c-danger); font-size: 12px; min-height: 14px; }

.btn {
  border: none; border-radius: 4px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
}
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-header-dark); }
.btn-ok { background: var(--c-ok); color: #fff; }
.btn-ok:hover { filter: brightness(.95); }
.btn-warn { background: var(--c-warn); color: #fff; }
.btn-danger { background: var(--c-danger); color: #fff; }
.btn-ghost-c { background: #fff; color: var(--c-primary); border: 1px solid var(--c-border); }
.btn-ghost-c:hover { background: var(--c-primary-soft); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }

/* 快捷入口文字链接（查看申报跟踪、浏览案例库） */
.quick-link {
  display: inline-block; padding: 6px 14px; border-radius: 3px;
  color: var(--c-primary); font-size: 13px; text-decoration: none;
  border: 1px solid var(--c-border); background: #fff;
  line-height: 1.8;
}
.quick-link:hover { background: var(--c-primary-soft); }

/* 新增按钮（列表页顶部） */
.btn-new {
  background: var(--c-header); color: #fff; border: none;
  padding: 6px 16px; border-radius: 3px; cursor: pointer; font-size: 13px;
  font-weight: 600; margin-bottom: 10px;
}
.btn-new:hover { background: var(--c-header-dark); }

table.tbl { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; border: 1px solid var(--c-border); border-radius: 4px; overflow: hidden; }
table.tbl th, table.tbl td { border-bottom: 1px solid #eee; padding: 9px 11px; text-align: left; }
table.tbl th { background: #f5f7fa; color: var(--c-muted); font-weight: 700; white-space: nowrap; }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover td { background: #fafcff; }
.tag { padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.pending { background: var(--c-pending-soft); color: var(--c-pending); }
.tag.approved { background: var(--c-ok-soft); color: var(--c-ok); }
.tag.returned { background: var(--c-danger-soft); color: var(--c-danger); }
.tag.cat { background: var(--c-primary-soft); color: var(--c-primary); }

.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.case-card { border: 1px solid var(--c-border); border-radius: 6px; padding: 14px 16px; background: #fff; }
.case-card .case-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.case-card .case-title { font-weight: 700; font-size: 14px; color: var(--c-primary); }
.case-card .case-bg { color: var(--c-muted); font-size: 13px; margin-bottom: 10px; }
.case-card .kp { margin: 0; padding-left: 18px; font-size: 13px; color: var(--c-text); }
.case-card .kp li { margin-bottom: 4px; }

.flow { display: flex; flex-direction: column; gap: 0; position: relative; }
.flow-step { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
.flow-step:not(:last-child)::before {
  content: ''; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--c-tree-line);
}
.flow-dot {
  width: 34px; height: 34px; border-radius: 50%; background: var(--c-primary); color: #fff;
  display: grid; place-items: center; font-weight: 700; flex-shrink: 0; z-index: 1; font-size: 14px;
}
.flow-body { background: #fff; border: 1px solid var(--c-border); border-radius: 6px; padding: 10px 14px; flex: 1; }
.flow-body .ft { font-weight: 700; margin-bottom: 2px; font-size: 14px; }
.flow-body .fd { color: var(--c-muted); font-size: 13px; }
.flow-body .fa { color: var(--c-primary); font-size: 12px; margin-top: 5px; font-weight: 600; }

.alert { padding: 10px 13px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; }
.alert.info { background: var(--c-primary-soft); color: var(--c-primary-d); }
.alert.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.alert.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.empty { text-align: center; color: var(--c-muted); padding: 36px 0; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--c-muted); }
.kv dd { margin: 0; font-weight: 500; }
.section-title { font-size: 14px; font-weight: 700; margin: 14px 0 8px; color: var(--c-primary); }

/* ============================================================
 * 登录遮罩 & 弹窗
 * ============================================================ */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,30,60,.45); display: grid; place-items: center; z-index: 50;
}
.modal {
  background: #fff; border-radius: 8px; padding: 26px 28px; width: 420px; max-width: 92vw;
  box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.modal h2 { margin: 0 0 4px; font-size: 18px; color: var(--c-primary); }
.modal .sub { color: var(--c-muted); font-size: 13px; margin-bottom: 18px; }
.role-pick { display: flex; gap: 12px; margin-bottom: 14px; }
.role-opt {
  flex: 1; border: 2px solid var(--c-border); border-radius: 8px; padding: 14px; text-align: center;
  cursor: pointer; transition: .15s;
}
.role-opt:hover { border-color: var(--c-primary); }
.role-opt.sel { border-color: var(--c-primary); background: var(--c-primary-soft); }
.role-opt .ri { font-size: 26px; }
.role-opt .rn { font-weight: 700; margin-top: 6px; }

/* ============================================================
 * 登录页（全屏分栏：左侧品牌 + 右侧表单）
 * ============================================================ */
.login-wrap {
  position: fixed; inset: 0; display: flex; min-height: 100vh; z-index: 60;
}
.login-brand {
  flex: 1.1; background: linear-gradient(135deg, #005a82 0%, #0077AA 55%, #3399cc 100%);
  color: #fff; padding: 54px 52px; display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.login-brand::after {
  content: ''; position: absolute; right: -120px; top: -120px; width: 360px; height: 360px;
  background: rgba(255,255,255,.08); border-radius: 50%;
}
.login-brand::before {
  content: ''; position: absolute; left: -80px; bottom: -100px; width: 280px; height: 280px;
  background: rgba(255,255,255,.06); border-radius: 50%;
}
.lb-logo { font-size: 54px; margin-bottom: 18px; position: relative; z-index: 1; }
.lb-title { font-size: 30px; font-weight: 800; line-height: 1.3; letter-spacing: 1px; position: relative; z-index: 1; }
.lb-desc { margin-top: 16px; font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.85); position: relative; z-index: 1; }
.lb-tips { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; }
.lb-tip { display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,.92); }
.lt-ic { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center;
  background: rgba(255,255,255,.18); border-radius: 7px; font-size: 14px; }
.lb-foot { margin-top: auto; padding-top: 28px; font-size: 12px; color: rgba(255,255,255,.7); position: relative; z-index: 1; }

.login-card {
  flex: 1; background: #fff; display: flex; flex-direction: column; justify-content: center;
  padding: 48px 60px; max-width: 520px;
}
.login-h { margin: 0 0 6px; font-size: 24px; color: var(--c-primary); font-weight: 800; }
.login-sub { color: var(--c-muted); font-size: 14px; margin-bottom: 26px; }
.login-card .role-pick { margin-bottom: 20px; }
.login-card .role-opt { padding: 16px; }
.login-card .role-opt .rn { font-size: 15px; }
.login-demo {
  margin: 4px 0 14px; padding: 10px 14px;   background: #eef2f8; border: 1px dashed #c5d4e8;
  border-radius: 7px; font-size: 13px; color: #2a4d6e;
}
.login-demo b { color: #0077AA; }
.login-demo .ld-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.login-demo .ld-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.login-demo .ld-dot.stu { background: #0077AA; }
.login-demo .ld-dot.tea { background: #d46b08; }

/* 一键进入演示账号 */
.quick-login { display: flex; gap: 10px; margin-bottom: 14px; }
.quick-login .ql-btn {
  flex: 1; padding: 9px 8px; border: 1px solid #cfe0f7; background: #f5f9ff; color: #0077AA;
  border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; transition: .15s;
}
.quick-login .ql-btn:hover { background: #e0eaf5; border-color: #9eb8d6; }

.login-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; }
.login-card .btn-row { margin-top: 4px; }
.login-foot { margin-top: 18px; font-size: 12px; color: var(--c-muted); line-height: 1.6; }

/* 窄屏：品牌区收起，仅显示表单 */
@media (max-width: 720px) {
  .login-wrap { flex-direction: column; }
  .login-brand { flex: none; padding: 30px 28px; }
  .lb-tips, .lb-foot { display: none; }
  .login-card { max-width: none; padding: 36px 28px; }
}

/* ============================================================
 * 涉外收入申报单 —— 真实 ASOne 表格布局（对齐已审核详情页截图）
 * ============================================================ */

/* 申报单表单容器 */
.decl-form {
  background: #fff; border: 1px solid var(--c-table-border);
  border-radius: 3px; font-size: 13px;
}
.decl-form-table {
  width: 100%; border-collapse: collapse;
}
.decl-form-table td {
  border: 1px solid #d8dde4; padding: 3px 6px; vertical-align: middle;
  line-height: 1.5; font-size: 12px;
}
/* 左侧标签列 */
.decl-form-table .label-cell {
  background: #eef1f5; color: #333; font-weight: 400;
  width: 120px; text-align: right; padding: 3px 8px 3px 4px; white-space: nowrap; font-size: 12px;
}
/* 分组标题行（如：收款人 / 结算方式） */
.decl-form-table .section-row td {
  background: #f0f4f8; font-weight: 700; color: var(--c-header);
  padding: 6px 10px; font-size: 13px; border-bottom: 2px solid #d5dde6;
}
/* 只读值 */
.decl-form-table .value-cell {
  color: #222; background: #fafbfc;
}
/* ★ 银行预填只读值（编辑模式下，非红框字段的显示） */
.decl-form-table .value-cell .ro-val {
  display: inline-block; width: 100%; padding: 2px 6px;
  background: #f0f2f5; border: 1px solid #e0e4ea; border-radius: 2px;
  color: #555; font-size: 12px; min-height: 20px;
  cursor: not-allowed;
}
/* 银行预填数值字段（如结汇金额/账号等）加一个淡淡的左标识线 */
.decl-form-table .value-cell .ro-val::before {
  content: ''; display: inline-block; width: 3px; height: 14px;
  background: #bbb; border-radius: 1px; vertical-align: middle;
  margin-right: 6px; position: relative; top: -1px;
}
.decl-form-table .value-cell.readonly {
  background: #f5f7fa;
}
.decl-form-table .value-cell.readonly .ro-val,
.decl-form-table .value-cell.readonly textarea {
  background: #eee; color: #666;
}
.decl-form-table .value-cell input,
.decl-form-table .value-cell select,
.decl-form-table .value-cell textarea {
  width: 100%; border: 1px solid #ccc; border-radius: 2px;
  padding: 2px 6px; font-size: 12px; font-family: inherit;
  background: #fff; color: #222;
}
.decl-form-table .value-cell input:focus,
.decl-form-table .value-cell select:focus,
.decl-form-table .value-cell textarea:focus {
  outline: none; border-color: var(--c-header); box-shadow: 0 0 0 2px rgba(0,153,204,.15);
}
.decl-form-table .value-cell textarea {
  resize: vertical; min-height: 36px;
}
/* 单选/复选框不参与 width:100%，保持行内紧凑 */
.decl-form-table .value-cell input[type="radio"],
.decl-form-table .value-cell input[type="checkbox"] {
  width: auto; display: inline-block; vertical-align: middle; margin: 0 2px 0 0;
}

/* 复选框组（结算方式 / 收入类型 / 对私类型） */
.checkbox-group { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.checkbox-group label {
  display: flex; align-items: center; gap: 3px; cursor: pointer; font-weight: normal;
  white-space: nowrap; font-size: 12px;
}
.checkbox-group input[type="checkbox"] { margin: 0; cursor: pointer; }

/* 大文本区域（企业意见/银行意见/外汇局意见） */
.opinion-textarea {
  width: 100%; min-height: 60px; border: 1px solid #ccc; border-radius: 2px;
  padding: 6px 8px; font-size: 13px; font-family: inherit;
  resize: vertical; background: #fff;
}
.opinion-textarea:focus {
  outline: none; border-color: var(--c-header);
}
.opinion-textarea.readonly {
  background: #f5f7fa; color: #444;
}

/* 返回按钮（右上角） */
.decl-toolbar {
  display: flex; justify-content: flex-end; margin-bottom: 8px;
}
.btn-back {
  background: #fff; color: var(--c-tree-text); border: 1px solid var(--c-table-border);
  padding: 4px 14px; border-radius: 3px; cursor: pointer; font-size: 13px;
  font-weight: 600;
}
.btn-back:hover {
  background: var(--c-tree-hover); border-color: var(--c-primary); color: var(--c-primary);
}

/* 必填标记 */
.req-mark { color: var(--c-danger); margin-left: 2px; }

/* 子标签文字提示 */
.hint-text { color: #888; font-size: 12px; }

/* ★ 国家代码输入框（代码输入 + 国名显示，对齐ASOne截图） */
.country-code-input {
  display: flex; align-items: center; gap: 8px;
}
.country-code-input input {
  border: 1px solid var(--c-header); border-radius: 2px;
  padding: 4px 6px; font-size: 13px; font-family: 'Courier New', monospace;
  text-align: center; letter-spacing: 2px;
}
.country-code-input input:focus {
  outline: none; border-color: var(--c-primary);
  box-shadow: 0 0 0 2px rgba(0,153,204,.15);
}
.country-name-display {
  color: var(--c-text); font-size: 13px;
  min-width: 80px; padding: 3px 6px;
  background: #f8f9fa; border-radius: 2px;
}

/* ★ 交易附言格式提示（根据交易编码动态显示模板） */
.narrative-hint {
  margin-top: 6px; padding: 5px 8px;
  background: #eef7fb; border-left: 3px solid var(--c-header);
  border-radius: 2px; font-size: 12px; color: #335;
}
.narrative-hint code {
  background: #fff; border: 1px solid #cfe3ec; border-radius: 2px;
  padding: 1px 5px; font-family: 'Courier New', monospace; color: #b3430b;
}

/* ★ 申报规则卡片（流程指引页） */
.rule-card {
  border: 1px solid #e2e8f0; border-radius: 4px;
  padding: 10px 14px; margin-bottom: 10px; background: #fbfdff;
}
.rule-card .rule-title {
  font-weight: 700; color: var(--c-header); font-size: 14px; margin-bottom: 4px;
}
.rule-card .rule-tpl {
  margin: 4px 0 6px; font-size: 12px;
}
.rule-card .rule-tpl code {
  background: #fff; border: 1px solid #cfe3ec; border-radius: 2px;
  padding: 1px 5px; font-family: 'Courier New', monospace; color: #b3430b;
}

/* 响应式 */
@media (max-width: 880px) {
  .sidebar { display: none; }
  .form-grid, .case-grid { grid-template-columns: 1fr; }
  .decl-form-table .label-cell { width: 100px; font-size: 12px; }
}

/* ===== 学习码门禁 ===== */
.gate-mask {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #eaf4fa 0%, #d6e9f3 100%);
  font-family: "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
}
.gate-box {
  width: 360px; max-width: 90vw; background: #fff; border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0,90,140,.18); padding: 28px 26px 24px;
  text-align: center; border: 1px solid #e1ecf3;
}
.gate-logo { font-size: 22px; font-weight: 800; color: #0077AA; letter-spacing: 1px; }
.gate-sub { font-size: 12px; color: #888; margin: 6px 0 18px; }
.gate-field { text-align: left; margin-bottom: 14px; }
.gate-field label { display:block; font-size:13px; color:#444; margin-bottom:6px; font-weight:600; }
.gate-field input {
  width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
  border: 1px solid #cfd9e2; border-radius: 8px; outline: none;
}
.gate-field input:focus { border-color: #0077AA; box-shadow: 0 0 0 3px rgba(0,119,170,.12); }
.gate-btn {
  width:100%; padding:11px; font-size:15px; font-weight:700; color:#fff; cursor:pointer;
  background:#0077AA; border:none; border-radius:8px; margin-top:4px;
}
.gate-btn:hover { background:#006690; }
.gate-err { color:#c0392b; font-size:12px; min-height:16px; margin-top:8px; }
.gate-tip { font-size:11px; color:#aaa; margin-top:14px; line-height:1.5; }

/* ===== 品牌水印 + 专属授权角标 ===== */
.wm-layer {
  position: fixed; inset: 0; z-index: 500; pointer-events: none; overflow: hidden;
  display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
  opacity: .06; font-size: 26px; font-weight: 800; color: #0077AA;
  transform: rotate(-22deg); user-select: none;
}
.wm-layer span { margin: 18px 34px; white-space: nowrap; }
.wm-badge {
  position: fixed; right: 12px; bottom: 10px; z-index: 600; pointer-events: none;
  background: rgba(0,119,170,.92); color:#fff; font-size:12px; font-weight:700;
  padding: 5px 12px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,.18);
  font-family: "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
.wm-copy {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 600; pointer-events: none;
  text-align: center; font-size: 11px; color: #99a; background: rgba(255,255,255,.7);
  padding: 3px 0; font-family: "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
